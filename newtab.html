<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookmarks</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="extension-icon.svg">
    <link rel="stylesheet" href="theme.css">
    <script type="module" src="theme-page.js"></script>
    <link rel="stylesheet" href="newtab.css">
    <link rel="stylesheet" href="bookmark-editor.css">
    <script type="module" src="newtab.js"></script>
  </head>
  <body>
    <main id="page">
      <section id="unfoldered" aria-label="Bookmarks directly in Other Bookmarks">
        <div id="direct-bookmarks"></div>
      </section>
      <section id="folders" aria-label="Bookmark folders"></section>
      <p id="status" role="status" hidden></p>
    </main>
    <div id="drop-line" aria-hidden="true" hidden></div>
    <div id="bookmark-menu" class="bookmark-menu" role="group" aria-label="Bookmark and folder actions" hidden>
      <button type="button" class="menu-button" data-action="add-bookmark">Add Bookmark</button>
      <button type="button" class="menu-button" data-action="add-folder">Add Folder</button>
      <button type="button" class="menu-button" data-action="edit"><span>Edit</span></button>
      <button type="button" class="menu-button" data-action="delete">Delete</button>
    </div>
    <dialog id="bookmark-editor" aria-labelledby="bookmark-editor-title">
      <form id="bookmark-edit-form">
        <h2 id="bookmark-editor-title">Edit Bookmark</h2>
        <fieldset id="bookmark-edit-fields">
          <label for="bookmark-edit-name">Name</label>
          <input id="bookmark-edit-name" type="text" autocomplete="off" autofocus>
          <label id="bookmark-edit-url-label" for="bookmark-edit-url">URL</label>
          <input id="bookmark-edit-url" type="text" autocomplete="off" spellcheck="false">
          <p id="bookmark-edit-error" role="alert" hidden></p>
          <div class="editor-actions">
            <button id="bookmark-edit-cancel" type="button">Cancel</button>
            <button id="bookmark-edit-submit" type="submit">Save</button>
          </div>
        </fieldset>
      </form>
    </dialog>
  </body>
</html>
