<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookmarks</title>
    <link rel="stylesheet" href="newtab.css">
    <script type="module" src="newtab.js"></script>
  </head>
  <body>
    <main id="page">
      <section id="unfoldered" aria-label="Bookmarks directly in Other Bookmarks">
        <div id="direct-bookmarks"></div>
      </section>
      <section id="folders" aria-label="Bookmark folders"></section>
      <p id="status" role="status" hidden></p>
    </main>
    <div id="bookmark-menu" class="bookmark-menu" role="group" aria-label="Bookmark and folder actions" hidden>
      <button type="button" class="menu-button" data-action="rename">Rename</button>
      <button type="button" class="menu-button" data-action="delete">Delete</button>
    </div>
  </body>
</html>
